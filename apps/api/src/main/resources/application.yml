spring:
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  flyway:
    enabled: true
    default-schema: ${DB_SCHEMA:todayit}
    schemas: ${DB_SCHEMA:todayit}
    create-schemas: true
    locations:
      - classpath:db/migration

todayit:
  security:
    jwt:
      secret: ${JWT_SECRET}
      access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION}

  email:
    resend:
      api-key: ${RESEND_API_KEY:}
      from: ${RESEND_FROM:}

    verification:
      code-ttl: 30m
      resend-cooldown: 1m
      max-failure-count: 3
      verification-token-ttl: 30m
      send-window: 10m
      max-send-count: 5
      send-block-duration: 30m

springdoc:
  api-docs:
    enabled: ${OPENAPI_ENABLED:false}
scalar:
  enabled: ${OPENAPI_ENABLED:false}
